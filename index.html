<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MusicWave — Портфолио</title>
    <meta name="description" content="Музыкальный сервис с поиском и плеером. Демонстрация навыков работы с API.">
    <style>
        :root {
            --bg: #0f0f14;
            --surface: #1a1a24;
            --primary: #6c5ce7;
            --text: #eeeeee;
            --text-muted: #b2bec3;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Шапка */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 24px;
            background-color: var(--surface);
            position: sticky;
            top: 0;
            z-index: 10;
            flex-wrap: wrap; /* Чтобы на мобилках переносилось */
            gap: 16px;
        }
        .logo { font-size: 1.5rem; font-weight: 700; color: var(--text); display: flex; align-items: center; gap: 8px; text-decoration: none; }
        .search-bar { display: flex; gap: 8px; flex: 1; max-width: 500px; min-width: 250px; }
        .search-bar input {
            flex: 1; padding: 10px 16px; border-radius: 20px; border: 1px solid #333;
            background: var(--bg); color: var(--text); outline: none;
        }
        .search-bar input:focus { border-color: var(--primary); }
        .search-bar button {
            padding: 10px 20px; border-radius: 20px; border: none; background: var(--primary);
            color: white; font-weight: 600; cursor: pointer; transition: opacity 0.2s;
        }
        .search-bar button:hover { opacity: 0.8; }

        /* Меню навигации */
        nav {
            display: flex;
            gap: 8px;
            padding: 16px 24px 0;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            overflow-x: auto; /* Скролл, если не влезает на телефоне */
            white-space: nowrap;
        }
        .nav-btn {
            background: transparent;
            border: 1px solid #333;
            color: var(--text-muted);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.95rem;
            transition: all 0.2s;
        }
        .nav-btn:hover { border-color: var(--primary); color: var(--text); }
        .nav-btn.active { background: var(--primary); border-color: var(--primary); color: white; font-weight: 600; }

        /* Контент */
        main { flex: 1; padding: 24px; max-width: 1200px; margin: 0 auto; width: 100%; }
        h2 { margin-bottom: 16px; font-size: 1.5rem; }
        
        .loader { display: none; text-align: center; padding: 40px; color: var(--primary); font-size: 1.2rem; }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 24px;
        }
        .card {
            background: var(--surface); border-radius: 12px; padding: 16px; cursor: pointer;
            transition: background 0.2s, transform 0.2s; display: flex; flex-direction: column; gap: 8px;
        }
        .card:hover { background: #252536; transform: translateY(-4px); }
        .card-img { width: 100%; aspect-ratio: 1; border-radius: 8px; background: #333; object-fit: cover; }
        .card-title { font-weight: 600; font-size: 1rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card-artist { color: var(--text-muted); font-size: 0.875rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* Плеер */
        .player {
            position: fixed; bottom: 0; left: 0; right: 0; background: var(--surface);
            padding: 16px 24px; display: none; align-items: center; gap: 16px;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.5); z-index: 20;
        }
        .player.active { display: flex; }
        .player-info { flex: 1; min-width: 0; }
        .player-title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .player-artist { font-size: 0.875rem; color: var(--text-muted); }
        .player audio { height: 40px; max-width: 300px; }

        /* Отступ снизу, чтобы плеер не перекрывал контент */
        body.has-player main { padding-bottom: 100px; }

        @media (max-width: 600px) {
            header { flex-direction: column; align-items: stretch; padding: 16px; }
            .search-bar { max-width: 100%; }
            nav { padding: 16px 16px 0; }
            .player { flex-direction: column; text-align: center; padding: 12px; }
            .player audio { width: 100%; }
            body.has-player main { padding-bottom: 140px; }
        }
    </style>
</head>
<body>

    <header>
        <a href="#" class="logo" onclick="loadSection('pop', 'Популярное', this)">🎵 MusicWave</a>
        <form class="search-bar" id="searchForm">
            <input type="text" id="searchInput" placeholder="Поиск музыки (например, Morgenshtern)...">
            <button type="submit">Найти</button>
        </form>
    </header>

    <!-- НОВОЕ МЕНЮ НАВИГАЦИИ -->
    <nav id="navMenu">
        <button class="nav-btn active" data-term="pop" data-title="Популярное прямо сейчас">🔥 Популярное</button>
        <button class="nav-btn" data-term="hits 2024" data-title="Главные хиты">🎧 Хиты</button>
        <button class="nav-btn" data-term="rock" data-title="Рок-музыка">🎸 Рок</button>
        <button class="nav-btn" data-term="rap" data-title="Хип-хоп и Рэп">🎤 Рэп</button>
        <button class="nav-btn" data-term="electronic" data-title="Электронная музыка">🎹 Электроника</button>
        <button class="nav-btn" data-term="jazz" data-title="Джаз">🎷 Джаз</button>
    </nav>

    <main>
        <h2 id="sectionTitle">Популярное прямо сейчас</h2>
        <div class="loader" id="loader">Загрузка...</div>
        <div class="grid" id="trackGrid"></div>
    </main>

    <div class="player" id="player">
        <div class="player-info">
            <div class="player-title" id="playerTitle">Название трека</div>
            <div class="player-artist" id="playerArtist">Исполнитель</div>
        </div>
        <audio id="audioPlayer" controls></audio>
    </div>

    <script>
        const trackGrid = document.getElementById('trackGrid');
        const sectionTitle = document.getElementById('sectionTitle');
        const player = document.getElementById('player');
        const audioPlayer = document.getElementById('audioPlayer');
        const playerTitle = document.getElementById('playerTitle');
        const playerArtist = document.getElementById('playerArtist');
        const searchForm = document.getElementById('searchForm');
        const searchInput = document.getElementById('searchInput');
        const loader = document.getElementById('loader');
        const navButtons = document.querySelectorAll('.nav-btn');

        const API_URL = 'https://itunes.apple.com/search';

        // Функция загрузки данных
        async function fetchMusic(term) {
            loader.style.display = 'block';
            trackGrid.innerHTML = '';
            
            try {
                // Добавил entity=song, чтобы iTunes искал именно треки, а не альбомы или подкасты
                const response = await fetch(`${API_URL}?term=${encodeURIComponent(term)}&media=music&entity=song&limit=24`);
                const data = await response.json();
                
                if (data.results.length === 0) {
                    trackGrid.innerHTML = '<p style="color: var(--text-muted)">Ничего не найдено. Попробуйте другой запрос.</p>';
                } else {
                    renderTracks(data.results);
                }
            } catch (error) {
                console.error(error);
                trackGrid.innerHTML = '<p style="color: red">Ошибка загрузки. Проверьте интернет.</p>';
            } finally {
                loader.style.display = 'none';
            }
        }

        // Отрисовка карточек
        function renderTracks(tracks) {
            trackGrid.innerHTML = '';
            tracks.forEach(track => {
                const artwork = track.artworkUrl100 ? track.artworkUrl100.replace('100x100', '300x300') : 'https://via.placeholder.com/300?text=No+Cover';
                
                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => playTrack(track);
                
                card.innerHTML = `
                    <img class="card-img" src="${artwork}" alt="${track.trackName}" loading="lazy">
                    <div class="card-title">${track.trackName}</div>
                    <div class="card-artist">${track.artistName}</div>
                `;
                trackGrid.appendChild(card);
            });
        }

        // Воспроизведение
        function playTrack(track) {
            if (!track.previewUrl) {
                alert("У этого трека нет 30-секундного превью.");
                return;
            }
            player.classList.add('active');
            document.body.classList.add('has-player');
            playerTitle.textContent = track.trackName;
            playerArtist.textContent = track.artistName;
            
            audioPlayer.src = track.previewUrl;
            audioPlayer.play();
        }

        // Логика переключения разделов
        function loadSection(term, title, btn) {
            sectionTitle.textContent = title;
            fetchMusic(term);
            
            // Убираем активный класс со всех кнопок
            navButtons.forEach(b => b.classList.remove('active'));
            // Добавляем на нажатую (если передали кнопку)
            if (btn) btn.classList.add('active');
        }

        // Обработка кнопок навигации
        navButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                loadSection(btn.dataset.term, btn.dataset.title, btn);
            });
        });

        // Обработка поиска
        searchForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const query = searchInput.value.trim();
            if (!query) return;

            // При поиске сбрасываем активную кнопку меню, так как это ручной запрос
            navButtons.forEach(b => b.classList.remove('active'));
            sectionTitle.textContent = `Результаты поиска: "${query}"`;
            fetchMusic(query);
        });

        // Инициализация
        document.addEventListener('DOMContentLoaded', () => {
            fetchMusic('pop');
        });
    </script>
</body>
</html>
